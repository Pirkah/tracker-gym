<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PULSE" />
  <meta name="theme-color" content="#050507" />
  <title>PULSE — Spatial Gym Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Atmospheric Mesh & Subtle Dot Grid -->
    <div class="canvas-backdrop">
      <div class="ambient-aurora aurora-1"></div>
      <div class="ambient-aurora aurora-2"></div>
      <div class="dot-matrix"></div>
    </div>

    <!-- Open Editorial Header -->
    <header class="top-bar" id="top-bar">
      <div class="top-bar-left">
        <span class="brand-kicker" id="page-kicker">AUJOURD'HUI</span>
        <h1 id="page-title">Entraînement</h1>
      </div>
      <div class="top-bar-right" id="top-bar-actions"></div>
    </header>

    <!-- Main Spatial Canvas -->
    <main class="main-content" id="main-content">
      <section id="tab-workout" class="tab-view active">
        <div id="workout-container"></div>
      </section>

      <section id="tab-templates" class="tab-view">
        <div id="templates-container"></div>
      </section>

      <section id="tab-stats" class="tab-view">
        <div id="stats-container"></div>
      </section>

      <section id="tab-settings" class="tab-view">
        <div id="settings-container"></div>
      </section>
    </main>

    <!-- Floating Liquid Glass Rest Timer Capsule -->
    <div id="rest-timer-bar" class="rest-timer-island hidden">
      <div class="island-top">
        <div class="island-left">
          <div class="island-ring-wrap">
            <svg class="island-ring" viewBox="0 0 36 36">
              <circle class="island-ring-bg" cx="18" cy="18" r="15"></circle>
              <circle class="island-ring-fill" id="rest-timer-ring" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="0"></circle>
            </svg>
          </div>
          <div class="island-text">
            <span class="island-label" id="rest-timer-exo-name">Récupération</span>
            <span class="island-time" id="rest-timer-display">03:00</span>
          </div>
        </div>
        <div class="island-actions">
          <button type="button" class="island-pill-btn" id="timer-minus-15">-15s</button>
          <button type="button" class="island-pill-btn" id="timer-plus-15">+15s</button>
          <button type="button" class="island-pill-btn island-watch-btn" id="timer-watch-trigger" title="Envoyer vers Apple Watch">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6V3h6v3"/><path d="M9 18v3h6v-3"/></svg>
          </button>
          <button type="button" class="island-close-btn" id="timer-skip" title="Passer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Liquid Glass Main Navigation Bar -->
    <div class="dock-wrapper">
      <nav class="liquid-glass-dock">
        <div class="liquid-glare"></div>
        <button type="button" class="dock-item active" data-tab="workout">
          <div class="dock-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
            <span id="active-workout-dot" class="dock-live-dot hidden"></span>
          </div>
          <span>Séance</span>
        </button>

        <button type="button" class="dock-item" data-tab="templates">
          <div class="dock-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h10M4 18h14"/>
            </svg>
          </div>
          <span>Programmes</span>
        </button>

        <button type="button" class="dock-item" data-tab="stats">
          <div class="dock-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 20h20"/>
              <path d="M5 16c3-6 5-9 8-4s4-7 7-9"/>
            </svg>
          </div>
          <span>Courbes</span>
        </button>

        <button type="button" class="dock-item" data-tab="settings">
          <div class="dock-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="5" width="12" height="14" rx="3.5"/>
              <path d="M9 5V2h6v3M9 19v3h6v-3"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
          </div>
          <span>Watch & Cloud</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Fluid Glass Sheet Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 id="modal-title">Titre</h3>
        <button type="button" class="modal-close-btn" id="modal-close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js?v=6"></script>
</body>
</html>
